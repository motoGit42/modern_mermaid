server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # PWA: never cache the service worker or its manifest,
    # else clients get stuck on old versions.
    location ~* ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Hashed assets never change. Cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback.
    location / {
        try_files $uri /index.html;
    }
}
